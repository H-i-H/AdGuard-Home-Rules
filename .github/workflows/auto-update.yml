name: Daily Rules Update
on:
  schedule:
    - cron: '0 22 * * *'  # UTC 22:00 = UTC+8 次日 06:00
  workflow_dispatch:

concurrency:
  group: rules-update
  cancel-in-progress: false

jobs:
  update-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify scripts exist
        run: |
          missing=()
          for script in fetch_upstream.py merge_rules.py whitelist_processor.py combine_final.py; do
            [ -f "scripts/$script" ] || missing+=("$script")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "❌ Missing scripts: ${missing[*]}"
            exit 1
          fi

      - name: Lint scripts
        run: python -m py_compile scripts/*.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create necessary directories
        run: mkdir -p sources filters Release

      - name: Run rules pipeline
        run: |
          python scripts/fetch_upstream.py
          python scripts/merge_rules.py
          python scripts/whitelist_processor.py
          python scripts/combine_final.py

      - name: Validate rules
        run: |
          FILE="Release/combined-rules.txt"
          if [ -s "$FILE" ]; then
            echo "✅ Rules generated successfully"
            echo "Line count: $(wc -l < "$FILE")"
            du -h "$FILE" filters/*.txt
          else
            echo "❌ Combined rules file is empty or missing!"
            exit 1
          fi

      - name: Commit small files only
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git rm --cached -r --ignore-unmatch filters Release/combined-rules.txt
          git add .gitignore Release/combined-whitelist.txt Release/special-rules.txt
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi

      - name: Publish rule files to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          gh release create "$TAG" \
            --title "Daily rules" \
            --notes "每日自动构建产物，请从本页 Asset 订阅，勿从 git 历史取文件。" \
            2>/dev/null || true
          gh release upload "$TAG" \
            filters/ads-blacklist.txt \
            filters/malware-blacklist.txt \
            filters/adult-blacklist.txt \
            Release/combined-rules.txt \
            --clobber
