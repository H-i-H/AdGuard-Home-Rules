name: Daily Rules Update
on:
  schedule:
    # 每 12 小时自动更新一次（UTC 00:00 和 12:00，对应北京时间 08:00 和 20:00）
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  update-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Verify scripts exist
        run: |
          missing=()
          for script in fetch_upstream.py merge_rules.py whitelist_processor.py combine_final.py; do
            [ -f "scripts/$script" ] || missing+=("$script")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "❌ Missing scripts: ${missing[*]}"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests tldextract

      - name: Create necessary directories
        run: mkdir -p sources filters scripts Release

      # 第一步：仅下载上游源文件
      - name: Fetch upstream sources
        run: python scripts/fetch_upstream.py

      # 第二步：检查 sources 目录是否有变化
      - name: Check for upstream changes
        id: check_changes
        run: |
          if git diff --quiet sources/; then
            echo "✅ No changes in upstream sources, skipping pipeline."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "🔄 Changes detected in upstream sources."
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      # 第三步：仅在有变化时才执行合并和处理
      - name: Run rules pipeline
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          python scripts/merge_rules.py
          python scripts/whitelist_processor.py
          python scripts/combine_final.py

      - name: Validate rules
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          FILE="Release/combined-rules.txt"
          if [ -s "$FILE" ]; then
            echo "✅ Rules generated successfully"
            echo "Line count: $(wc -l < "$FILE")"
          else
            echo "❌ Combined rules file is empty or missing!"
            exit 1
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          if ! git diff --quiet || ! git diff --staged --quiet; then
            git add Release/ sources/
            git commit -m "Auto-update: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "No changes to commit"
          fi
