name: Daily Rules Update
on:
  schedule:
    - cron: '0 22 * * *'  # UTC 22:00 = UTC+8 Asia/Shanghai timezone: 06:00
  workflow_dispatch:

concurrency:
  group: rules-update
  cancel-in-progress: false

jobs:
  update-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify scripts exist
        run: |
          missing=()
          for script in fetch_upstream.py merge_rules.py whitelist_processor.py combine_final.py; do
            [ -f "scripts/$script" ] || missing+=("$script")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "❌ Missing scripts: ${missing[*]}"
            exit 1
          fi

      - name: Lint scripts
        run: python -m py_compile scripts/*.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create necessary directories
        run: mkdir -p sources filters Release

      - name: Run rules pipeline
        run: |
          python scripts/fetch_upstream.py
          python scripts/merge_rules.py
          python scripts/whitelist_processor.py
          python scripts/combine_final.py

      - name: Validate rules
        run: |
          FILE="filters/combined-rules.txt"
          if [ -s "$FILE" ]; then
            echo "✅ Rules generated successfully"
            echo "Line count: $(wc -l < "$FILE")"
            du -h filters/*.txt
          else
            echo "❌ Combined rules file is empty or missing!"
            exit 1
          fi

      - name: Check file sizes (GitHub hard limit 100MB, warn 50MB)
        run: |
          for f in filters/*.txt; do
            size=$(stat -c%s "$f")
            if [ "$size" -gt 94371840 ]; then
              echo "❌ $f is $((size/1048576))MB (>90MB), push will be rejected!"
              exit 1
            elif [ "$size" -gt 52428800 ]; then
              echo "⚠️ $f is $((size/1048576))MB (>50MB), consider slimming sources."
            fi
          done

      - name: Commit and push changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add filters/ Release/combined-whitelist.txt
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
